<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<title>Open Your Shop — Stuflover</title>
<meta name="description" content="Set up your Stuflover shop. A few quick questions and your storefront is live."/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@800;900&family=Nunito:wght@400;600;700&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/stuflover-nav.css"/>
<script src="/stuflover-theme-boot.js"></script>
<link rel="stylesheet" href="/stuflover-design-system.css"/>
<link rel="stylesheet" href="/shop.css"/>
<style>
  .wizard{
    max-width:640px;margin:0 auto;padding:40px 32px 48px;
    background:#fff;border-radius:28px;
    border:1px solid rgba(44, 29, 22,0.05);
    box-shadow:0 12px 40px rgba(30,12,6,0.06);
  }
  .progress{
    display:flex;align-items:center;gap:10px;justify-content:center;
    margin-bottom:32px;
  }
  .progress .dot{
    width:32px;height:32px;border-radius:50%;
    background:rgba(44, 29, 22,0.08);color:rgba(44, 29, 22,0.4);
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    font-size:0.85rem;transition:all 0.25s;
  }
  .progress .dot.done{background:var(--shop-terracotta);color:#fff;}
  .progress .dot.cur{background:var(--shop-brown);color:#fff;transform:scale(1.08);}
  .progress .bar{flex:0 0 28px;height:2px;background:rgba(44, 29, 22,0.08);border-radius:2px;}
  .progress .bar.done{background:var(--shop-terracotta);}

  .step{display:none;animation:fadeIn 0.3s ease;}
  .step.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .step-eyebrow{
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:4px;text-transform:uppercase;
    font-size:0.62rem;color:var(--shop-terracotta);
    margin-bottom:8px;
  }
  .step h2{font-size:1.9rem;letter-spacing:-0.5px;margin-bottom:8px;line-height:1.1;}
  .step .lede{color:rgba(44, 29, 22,0.6);font-size:0.95rem;line-height:1.6;margin-bottom:22px;}

  .input-prefix{
    display:flex;align-items:center;gap:0;
    border:2px solid rgba(44, 29, 22,0.12);border-radius:14px;
    background:#fff;overflow:hidden;
    transition:border-color 0.2s;
  }
  .input-prefix:focus-within{border-color:var(--shop-terracotta);}
  .input-prefix .pre{
    padding:13px 4px 13px 16px;color:rgba(44, 29, 22,0.45);
    font-family:'Nunito',sans-serif;font-size:0.95rem;
  }
  .input-prefix input{
    flex:1;border:none;outline:none;padding:13px 16px 13px 0;
    font-family:'Nunito',sans-serif;font-size:0.95rem;background:transparent;color:var(--shop-brown);
  }
  .hint{
    font-size:0.78rem;margin-top:6px;color:rgba(44, 29, 22,0.5);
    min-height:18px;
  }
  .hint.ok{color:#2f8a4a;}
  .hint.err{color:var(--shop-terracotta);font-weight:700;}

  .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .opt{
    display:flex;align-items:flex-start;gap:10px;
    padding:14px 16px;border-radius:14px;cursor:pointer;
    border:2px solid rgba(44, 29, 22,0.1);background:#fff;
    transition:all 0.2s;text-align:left;
    font-family:'Nunito',sans-serif;color:var(--shop-brown);
  }
  .opt:hover{border-color:var(--shop-terracotta);}
  .opt.active{border-color:var(--shop-terracotta);background:rgba(200, 131, 106,0.06);}
  .opt-mark{
    flex-shrink:0;width:20px;height:20px;border-radius:50%;
    border:2px solid rgba(44, 29, 22,0.18);margin-top:2px;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.active .opt-mark{border-color:var(--shop-terracotta);background:var(--shop-terracotta);}
  .opt.active .opt-mark::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff;}
  .opt-body{flex:1;min-width:0;}
  .opt-title{font-weight:700;font-size:0.95rem;margin-bottom:2px;}
  .opt-desc{font-size:0.78rem;color:rgba(44, 29, 22,0.55);line-height:1.4;}

  .chip-group{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-pick{
    padding:10px 18px;border-radius:50px;
    border:2px solid rgba(44, 29, 22,0.12);background:#fff;color:var(--shop-brown);
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:2px;text-transform:uppercase;font-size:0.72rem;
    cursor:pointer;transition:all 0.18s;
  }
  .chip-pick:hover{border-color:var(--shop-terracotta);}
  .chip-pick.active{background:var(--shop-terracotta);color:#fff;border-color:var(--shop-terracotta);}

  .nav-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:28px;gap:12px;
  }
  .nav-row .spacer{flex:1;}
  .btn.btn-link{
    border:none;background:transparent;color:var(--shop-brown);opacity:0.55;
    box-shadow:none;padding:10px 14px;
  }
  .btn.btn-link:hover{opacity:1;transform:none;border:none;}

  .review-list{
    background:rgba(239, 226, 218,0.4);border-radius:18px;
    padding:18px 22px;margin-bottom:18px;
  }
  .review-list dt{
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:2px;text-transform:uppercase;font-size:0.65rem;
    color:rgba(44, 29, 22,0.55);margin-top:10px;
  }
  .review-list dt:first-child{margin-top:0;}
  .review-list dd{font-size:0.95rem;color:var(--shop-brown);margin-top:2px;}

  .auth-block{
    max-width:480px;margin:0 auto;text-align:center;
    padding:48px 28px;background:#fff;border-radius:24px;
    border:1px solid rgba(44, 29, 22,0.05);
  }

  /* Pep talk — friendly micro-copy after each step */
  .pep{
    text-align:center;font-family:'Dancing Script',cursive;font-size:1.4rem;
    color:var(--shop-terracotta);opacity:0;transform:translateY(8px);
    margin-bottom:12px;min-height:32px;
    transition:opacity 0.4s,transform 0.4s;
  }
  .pep.show{opacity:0.85;transform:none;}

  .skip-link{
    display:inline-block;margin-top:8px;
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;
    color:rgba(44, 29, 22,0.45);text-decoration:underline;
    text-underline-offset:3px;cursor:pointer;background:none;border:none;
  }
  .skip-link:hover{color:var(--shop-terracotta);}

  .reassure{
    margin-top:10px;font-size:0.78rem;color:rgba(44, 29, 22,0.5);
    text-align:center;font-style:italic;
  }

  /* Suggest button next to inputs */
  .suggest-btn{
    align-self:flex-start;margin-top:4px;
    font-family:'Dancing Script',cursive;font-size:1.05rem;
    color:var(--shop-terracotta);background:none;border:none;
    cursor:pointer;padding:2px 4px;text-decoration:underline;
    text-underline-offset:3px;
  }
  .suggest-btn:hover{opacity:0.7;}

  /* Confetti */
  .confetti-layer{
    position:fixed;inset:0;pointer-events:none;z-index:700;overflow:hidden;
  }
  .confetti-bit{
    position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translate3d(var(--dx,0),110vh,0) rotate(var(--rot,720deg)); }
  }

  @media(max-width:540px){
    .wizard{padding:28px 20px 32px;border-radius:20px;}
    .opts{grid-template-columns:1fr;}
    .step h2{font-size:1.5rem;}
  }
</style>
</head>
<body>
<script src="/stuflover-nav.js"></script>

<section class="shop-hero" style="min-height:auto;padding:110px 32px 30px;">
  <div class="reveal shop-eyebrow">✨ no pressure, just fun</div>
  <h1 class="reveal shop-title" style="font-size:clamp(3rem,9vw,6rem);">Let's make<br>your shop</h1>
  <p class="reveal shop-sub" style="max-width:480px;">4 tiny questions. takes a minute. you can change literally anything later — no big deal.</p>
  <div class="reveal shop-tag">it's giving small business</div>
</section>

<main class="shop-wrap" style="padding-top:0;">
  <div id="root"></div>
  <p style="text-align:center;margin-top:24px;color:rgba(44, 29, 22,0.4);font-size:0.85rem;">
    Already have a shop? <a href="/shop-mine.html" style="color:var(--shop-terracotta);font-weight:700;">Go to dashboard →</a>
  </p>
</main>

<div id="toast" class="toast"></div>
<script src="/js/shop-common.js"></script>
<script src="/js/shop-create.js"></script>
</body>
</html>
