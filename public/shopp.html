<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<title>Shop — Stuflover</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Nunito:wght@400;600;700&family=Caveat:wght@400;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/stuflover-nav.css"/>
<script src="/stuflover-theme-boot.js"></script>
<link rel="stylesheet" href="/stuflover-design-system.css"/>
<link rel="stylesheet" href="/shop.css"/>
<style>
  .demo-banner{
    background:var(--shop-terracotta);color:#fff;text-align:center;
    padding:9px 20px;font-family:'Barlow Condensed',sans-serif;font-weight:900;
    letter-spacing:2px;text-transform:uppercase;font-size:0.7rem;
  }
  .card-actions{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .card-actions .variant{
    width:100%;padding:9px 14px;border-radius:12px;
    border:2px solid rgba(42,26,20,0.12);background:#fff;color:var(--shop-brown);
    font-family:'Nunito',sans-serif;font-size:0.85rem;
  }
  .card-actions .btn{justify-content:center;width:100%;}

  /* Floating cart button */
  .cart-fab{
    position:fixed;bottom:24px;right:24px;z-index:500;
    display:inline-flex;align-items:center;gap:8px;
    padding:14px 22px;border-radius:50px;border:none;cursor:pointer;
    background:var(--shop-brown);color:#fff;
    font-family:'Barlow Condensed',sans-serif;font-weight:900;
    letter-spacing:3px;text-transform:uppercase;font-size:0.78rem;
    box-shadow:0 12px 32px rgba(30,12,6,0.25);transition:transform 0.15s;
  }
  .cart-fab:hover{transform:translateY(-2px);}

  /* Cart drawer */
  .drawer-backdrop{
    position:fixed;inset:0;background:rgba(30,12,6,0.5);
    z-index:600;opacity:0;pointer-events:none;transition:opacity 0.25s;
  }
  .drawer-backdrop.show{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);
    background:#fff;z-index:601;display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform 0.3s cubic-bezier(.2,.8,.2,1);
    box-shadow:-20px 0 60px rgba(30,12,6,0.2);
  }
  .drawer.show{transform:none;}
  .drawer-head{
    padding:20px 24px;border-bottom:1px solid rgba(42,26,20,0.08);
    display:flex;justify-content:space-between;align-items:center;
  }
  .drawer-head h2{font-size:1.4rem;margin:0;}
  .drawer-close{background:none;border:none;font-size:1.6rem;cursor:pointer;color:var(--shop-brown);line-height:1;}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 24px;}
  .drawer-foot{padding:18px 24px;border-top:1px solid rgba(42,26,20,0.08);}
  .di{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(42,26,20,0.06);}
  .di img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#f5e0e0;}
  .di .t{font-weight:600;font-size:0.92rem;line-height:1.25;}
  .di .v{font-size:0.74rem;color:rgba(42,26,20,0.5);text-transform:uppercase;letter-spacing:1px;}
  .di .qty-row{display:flex;align-items:center;gap:6px;margin-top:5px;}
  .di .qbtn{width:24px;height:24px;border-radius:7px;border:1.5px solid rgba(42,26,20,0.15);background:#fff;cursor:pointer;font-weight:700;color:var(--shop-brown);}
  .di .rm{background:none;border:none;color:rgba(42,26,20,0.4);cursor:pointer;font-size:0.74rem;text-decoration:underline;}
  .di .p{font-family:'Barlow Condensed',sans-serif;font-weight:900;color:var(--shop-terracotta);font-size:1.05rem;}
  .drawer-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .drawer-total .lbl{font-family:'Barlow Condensed',sans-serif;font-weight:900;letter-spacing:2px;text-transform:uppercase;font-size:0.78rem;color:rgba(42,26,20,0.55);}
  .drawer-total .amt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.8rem;color:var(--shop-terracotta);}
  .drawer-empty{text-align:center;color:rgba(42,26,20,0.5);padding:48px 12px;font-size:0.95rem;}
</style>
</head>
<body>
<script src="/stuflover-nav.js"></script>

<div id="demoBanner" class="demo-banner" style="display:none;">Demo catalog — set PRINTIFY_API_TOKEN to show live products</div>

<header class="shop-hero" style="min-height:auto;padding:120px 40px 50px;">
  <div class="shop-eyebrow">Stuflover Store</div>
  <h1 class="shop-title" style="font-size:clamp(3rem,9vw,6rem);">Shop the drop</h1>
  <p class="shop-sub">Print-on-demand goods, made to order and shipped by Printify.</p>
</header>

<main class="shop-wrap">
  <div id="grid" class="grid"></div>
</main>

<button id="cartFab" class="cart-fab" type="button">Cart <span id="cartCount"></span></button>

<div id="drawerBackdrop" class="drawer-backdrop"></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>Your Cart</h2>
    <button id="drawerClose" class="drawer-close" type="button" aria-label="Close">&times;</button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
  <div class="drawer-foot">
    <div class="drawer-total">
      <span class="lbl">Total</span>
      <span id="drawerTotal" class="amt">$0.00</span>
    </div>
    <button id="checkoutBtn" class="btn btn-primary" style="width:100%;justify-content:center;">Checkout</button>
  </div>
</aside>

<div id="toast" class="toast"></div>
<script src="/stuflover-config.js"></script>
<script src="/js/shop-common.js"></script>
<script src="/js/shopp.js"></script>
</body>
</html>
