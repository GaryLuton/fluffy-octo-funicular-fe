<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<title>Shop — Stuflover</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/stuflover-nav.css"/>
<script src="/stuflover-theme-boot.js"></script>
<link rel="stylesheet" href="/stuflover-design-system.css"/>
<link rel="stylesheet" href="/shop.css"/>
</head>
<body>
<script src="/stuflover-nav.js"></script>

<main class="shop-wrap">
  <header class="shop-header">
    <div>
      <div class="shop-eyebrow">Marketplace</div>
      <h1 class="shop-title">The Shop</h1>
      <p class="shop-sub">Handmade, vintage, and one-of-a-kind finds from creators across the Stuflover community. Open your own shop in 30 seconds.</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <a class="btn btn-ghost" href="/shop-cart">Cart <span id="cartCount" style="opacity:0.6;margin-left:4px"></span></a>
      <a class="btn btn-primary" href="/shop-mine">Open Your Shop</a>
    </div>
  </header>

  <div class="toolbar">
    <input id="q" class="search" placeholder="Search products, tags, makers…" autocomplete="off"/>
    <select id="sort" class="select">
      <option value="new">Newest</option>
      <option value="price_asc">Price: low to high</option>
      <option value="price_desc">Price: high to low</option>
    </select>
  </div>

  <div id="chips" class="chips"></div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none;">
    <div class="bc">Nothing here yet</div>
    <p>Be the first to list something — open a shop and add a product.</p>
  </div>
</main>

<div id="toast" class="toast"></div>
<script src="/js/shop.js"></script>
</body>
</html>
