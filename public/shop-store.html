<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<title>Shop — Stuflover</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@800;900&family=Nunito:wght@400;600;700&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/stuflover-nav.css"/>
<script src="/stuflover-theme-boot.js"></script>
<link rel="stylesheet" href="/stuflover-design-system.css"/>
<link rel="stylesheet" href="/shop.css"/>
<style>
  /* Storefront accent — overridden inline by shop.design.accentColor */
  .store{ --accent: var(--shop-terracotta); }
  .store .store-tag,
  .store .store-handle,
  .store .store-avatar{ color:var(--accent); }
  .store .opt.active .opt-mark,
  .store .chip-pick.active{ background:var(--accent); border-color:var(--accent); }

  .announce-bar{
    background:var(--accent);color:#fff;
    text-align:center;padding:10px 20px;
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:2px;text-transform:uppercase;font-size:0.75rem;
    position:relative;z-index:2;
  }

  .store-hero{
    position:relative;
    padding:120px 32px 56px;text-align:center;
    background:
      radial-gradient(circle at 20% 80%, rgba(200, 131, 106,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(230, 178, 160,0.55) 0%, transparent 45%),
      var(--shop-pink-light);
  }
  .store-banner{
    position:absolute;inset:0;overflow:hidden;
    background:#1e0c06;
  }
  .store-banner img{
    width:100%;height:100%;object-fit:cover;
    opacity:0.85;filter:saturate(1.05);
  }
  .store-banner::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(30,12,6,0.35) 0%,rgba(30,12,6,0.55) 60%,#fff 100%);
  }
  .store-hero.has-banner{padding-top:200px;}
  .store-hero.has-banner > *{position:relative;z-index:2;}
  .store-hero.has-banner .store-name,
  .store-hero.has-banner .store-bio,
  .store-hero.has-banner .store-meta{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.4);}
  .store-hero.has-banner .store-bio{color:rgba(255,255,255,0.92);}
  .store-hero.has-banner .store-meta{color:rgba(255,255,255,0.75);}
  .store-hero.has-banner .store-tag{
    background:rgba(255,255,255,0.92);border-color:rgba(255,255,255,0.5);
  }

  .store-social{
    display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap;
  }
  .store-social a{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px;border-radius:50px;
    background:#fff;border:1.5px solid rgba(44, 29, 22,0.12);
    color:var(--shop-brown);text-decoration:none;
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:2px;text-transform:uppercase;font-size:0.7rem;
    transition:transform 0.15s,border-color 0.15s;
  }
  .store-social a:hover{transform:translateY(-1px);border-color:var(--accent);}
  .store-hero.has-banner .store-social a{background:rgba(255,255,255,0.95);}

  .featured-section{margin:48px auto 0;max-width:1100px;padding:0 24px;}
  .featured-section .section-eyebrow{color:var(--accent);}
  .featured-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;
  }
  .featured-card{position:relative;}
  .featured-card::before{
    content:'★ featured';position:absolute;top:10px;left:10px;z-index:3;
    background:var(--accent);color:#fff;
    padding:5px 11px;border-radius:50px;
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:2px;text-transform:uppercase;font-size:0.6rem;
    box-shadow:0 4px 12px rgba(30,12,6,0.18);
  }

  .about-section{
    margin:48px auto 0;max-width:720px;padding:0 24px;
  }
  .about-card{
    background:#fff;border-radius:24px;padding:32px 36px;
    border:1px solid rgba(44, 29, 22,0.06);
    box-shadow:0 8px 28px rgba(30,12,6,0.04);
  }
  .about-card h2{
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    font-size:1.6rem;letter-spacing:-0.5px;margin-bottom:14px;color:var(--shop-brown);
  }
  .about-card p{
    color:rgba(44, 29, 22,0.75);line-height:1.75;font-size:0.98rem;
    white-space:pre-wrap;
  }
  .store-avatar{
    width:96px;height:96px;border-radius:50%;
    background:linear-gradient(135deg,#f5e0e0,#f0d0c8);
    margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    font-size:2.6rem;color:var(--shop-terracotta);
    box-shadow:0 8px 24px rgba(30,12,6,0.08);
    border:3px solid #fff;
  }
  .store-name{
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    font-size:clamp(2.6rem,7vw,5rem);letter-spacing:-1.5px;
    line-height:0.95;color:var(--shop-brown);margin-bottom:8px;
  }
  .store-handle{
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:3px;text-transform:uppercase;
    font-size:0.78rem;color:var(--shop-terracotta);margin-bottom:18px;
  }
  .store-bio{
    max-width:520px;margin:0 auto 14px;
    font-size:1.05rem;line-height:1.7;color:rgba(44, 29, 22,0.7);
  }
  .store-tags{
    display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    margin-top:14px;
  }
  .store-tag{
    padding:6px 14px;border-radius:50px;
    border:1.5px solid rgba(44, 29, 22,0.12);background:#fff;
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:2px;text-transform:uppercase;font-size:0.62rem;
    color:var(--shop-brown);
  }
  .store-meta{
    margin-top:18px;font-size:0.82rem;color:rgba(44, 29, 22,0.5);
    font-style:italic;
  }
  .store-owner-bar{
    margin-top:24px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
  }

  /* Welcome celebration banner for first-time visit */
  .welcome{
    max-width:680px;margin:32px auto 0;padding:22px 26px;
    background:linear-gradient(135deg,#fff,#fbe8ec);
    border:1.5px solid rgba(200, 131, 106,0.25);
    border-radius:20px;
    display:flex;gap:18px;align-items:flex-start;
    box-shadow:0 10px 30px rgba(30,12,6,0.06);
  }
  .welcome-emoji{font-size:2.2rem;line-height:1;flex-shrink:0;}
  .welcome h3{
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:1px;font-size:1.3rem;margin-bottom:4px;
    color:var(--shop-brown);
  }
  .welcome p{color:rgba(44, 29, 22,0.7);font-size:0.92rem;line-height:1.6;margin-bottom:10px;}
  .welcome-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .welcome .btn{padding:9px 18px;font-size:0.75rem;letter-spacing:2px;}

  .store-empty{
    text-align:center;padding:64px 24px;
    background:#fff;border-radius:24px;
    border:2px dashed rgba(44, 29, 22,0.12);
    max-width:560px;margin:0 auto;
  }
  .store-empty .icon{font-size:3rem;margin-bottom:8px;}
  .store-empty h3{
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:1px;font-size:1.6rem;margin-bottom:8px;color:var(--shop-brown);
  }
  .store-empty p{color:rgba(44, 29, 22,0.55);font-size:0.95rem;line-height:1.6;margin-bottom:18px;}

  .store-share{
    margin:32px auto 0;max-width:520px;
    padding:18px 22px;background:#fff;
    border:1px solid rgba(44, 29, 22,0.06);border-radius:18px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .store-share .label{
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:2px;text-transform:uppercase;font-size:0.7rem;
    color:rgba(44, 29, 22,0.55);
  }
  .store-share .url{
    flex:1;min-width:200px;font-family:'Nunito',sans-serif;
    font-size:0.9rem;color:var(--shop-brown);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* Owner inline edit affordances */
  .editable{position:relative;cursor:default;}
  .editable[data-owner="1"]{cursor:pointer;}
  .editable[data-owner="1"]::after{
    content:'✎';position:absolute;top:-6px;right:-22px;
    width:22px;height:22px;border-radius:50%;
    background:#fff;color:var(--accent);
    border:1.5px solid rgba(44, 29, 22,0.15);
    display:flex;align-items:center;justify-content:center;
    font-size:0.75rem;opacity:0;transition:opacity 0.15s,transform 0.15s;
    transform:scale(0.8);box-shadow:0 4px 10px rgba(30,12,6,0.1);
  }
  .editable[data-owner="1"]:hover::after{opacity:1;transform:scale(1);}
  .editable.placeholder{
    opacity:0.55;font-style:italic;
  }
  .announce-bar.editable[data-owner="1"]::after{
    top:50%;right:14px;transform:translateY(-50%) scale(0.8);
    background:rgba(255,255,255,0.95);color:var(--accent);border-color:transparent;
  }
  .announce-bar.editable[data-owner="1"]:hover::after{transform:translateY(-50%) scale(1);}

  /* Customize drawer */
  .cz-backdrop{
    position:fixed;inset:0;background:rgba(30,12,6,0.55);
    backdrop-filter:blur(6px);z-index:600;
    opacity:0;transition:opacity 0.25s;
  }
  .cz-backdrop.show{opacity:1;}
  .cz-drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);
    background:#fff;z-index:601;
    transform:translateX(100%);transition:transform 0.3s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto;box-shadow:-20px 0 60px rgba(30,12,6,0.2);
  }
  .cz-drawer.show{transform:none;}
  .cz-head{
    position:sticky;top:0;background:#fff;z-index:2;
    padding:22px 26px;border-bottom:1px solid rgba(44, 29, 22,0.08);
    display:flex;justify-content:space-between;align-items:center;
  }
  .cz-head h2{
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    font-size:1.5rem;letter-spacing:-0.5px;color:var(--shop-brown);margin:0;
  }
  .cz-body{padding:22px 26px 96px;}
  .cz-section{margin-bottom:28px;}
  .cz-section .cz-label{
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:3px;text-transform:uppercase;font-size:0.7rem;
    color:rgba(44, 29, 22,0.55);margin-bottom:10px;display:block;
  }
  .cz-section input[type="text"],
  .cz-section input[type="url"],
  .cz-section input[type="email"],
  .cz-section textarea{
    width:100%;border:2px solid rgba(44, 29, 22,0.12);border-radius:12px;
    padding:11px 14px;font-family:'Nunito',sans-serif;font-size:0.92rem;
    background:#fff;color:var(--shop-brown);outline:none;
    transition:border-color 0.15s;box-sizing:border-box;
  }
  .cz-section textarea{resize:vertical;min-height:90px;}
  .cz-section input:focus,
  .cz-section textarea:focus{border-color:var(--shop-terracotta);}
  .cz-hint{font-size:0.78rem;color:rgba(44, 29, 22,0.5);margin-top:6px;}
  .cz-swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .cz-swatch{
    width:34px;height:34px;border-radius:50%;cursor:pointer;
    border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(44, 29, 22,0.15);
    transition:transform 0.15s,box-shadow 0.15s;
  }
  .cz-swatch:hover{transform:scale(1.08);}
  .cz-swatch.active{box-shadow:0 0 0 3px var(--shop-brown);transform:scale(1.08);}
  .cz-hex{
    margin-left:6px;width:100px;padding:8px 10px;border-radius:8px;
    border:1.5px solid rgba(44, 29, 22,0.12);font-family:'Nunito',monospace;
    font-size:0.85rem;color:var(--shop-brown);outline:none;
  }
  .cz-social-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;}
  .cz-social-grid label{
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:2px;text-transform:uppercase;font-size:0.7rem;
    color:rgba(44, 29, 22,0.55);
  }
  .cz-feat-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;}
  .cz-feat-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:10px;cursor:pointer;
    border:1.5px solid rgba(44, 29, 22,0.1);background:#fff;
    transition:border-color 0.15s,background 0.15s;
  }
  .cz-feat-item:hover{border-color:var(--shop-terracotta);}
  .cz-feat-item.active{border-color:var(--shop-terracotta);background:rgba(200, 131, 106,0.06);}
  .cz-feat-item img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0;}
  .cz-feat-item .ti{
    flex:1;font-size:0.88rem;color:var(--shop-brown);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .cz-feat-item .mark{
    width:18px;height:18px;border-radius:5px;
    border:2px solid rgba(44, 29, 22,0.2);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:0.75rem;color:#fff;
  }
  .cz-feat-item.active .mark{background:var(--shop-terracotta);border-color:var(--shop-terracotta);}
  .cz-feat-item.active .mark::after{content:'✓';}
  .cz-footer{
    position:sticky;bottom:0;background:#fff;
    padding:16px 26px;border-top:1px solid rgba(44, 29, 22,0.08);
    display:flex;gap:10px;justify-content:flex-end;
  }
  .cz-err{
    color:#c8836a;font-weight:700;font-size:0.85rem;
    margin-right:auto;align-self:center;min-height:18px;
  }

  /* Customize FAB on storefront for owner */
  .cz-fab{
    position:fixed;bottom:24px;right:24px;z-index:500;
    padding:14px 22px;border-radius:50px;
    background:var(--shop-brown);color:#fff;
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;
    letter-spacing:3px;text-transform:uppercase;font-size:0.78rem;
    border:none;cursor:pointer;
    box-shadow:0 12px 32px rgba(30,12,6,0.25);
    transition:transform 0.15s;
  }
  .cz-fab:hover{transform:translateY(-2px);}

  /* Confetti */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:700;overflow:hidden;}
  .confetti-bit{
    position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{ to{ transform:translate3d(var(--dx,0),110vh,0) rotate(var(--rot,720deg)); } }

  @media(max-width:540px){
    .store-hero{padding:90px 20px 36px;}
    .store-avatar{width:80px;height:80px;font-size:2.2rem;}
    .welcome{flex-direction:column;}
  }
</style>
</head>
<body>
<script src="/stuflover-nav.js"></script>

<div id="content" class="store"></div>

<div id="toast" class="toast"></div>
<script src="/js/shop-common.js"></script>
<script src="/js/shop-store.js"></script>
</body>
</html>
